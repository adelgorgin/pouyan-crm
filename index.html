<!-- پیگیری مشتریان — کارگزاری پویان، شعبه شیراز -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:#EEF1F0;
    --card:#FFFFFF;
    --ink:#182A2E;
    --ink-soft:#5C6E71;
    --line:#DDE3E1;
    --teal:#0F6E5F;
    --teal-deep:#0B4F45;
    --teal-tint:#E4F1EE;
    --amber:#B9772F;
    --amber-tint:#FBEEE0;
    --brick:#A93E37;
    --brick-tint:#F7E7E5;
    --gold:#8A6A1F;
    --gold-tint:#F3ECD9;
    --violet:#5B4B8A;
    --violet-tint:#ECE8F5;
    --font: 'Vazirmatn', sans-serif;
  }
  *{box-sizing:border-box;}
  body,.root{margin:0;padding:0;}
  .root{
    font-family:var(--font);
    background:var(--paper);
    color:var(--ink);
    direction:rtl;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  .app-shell{display:flex;flex:1;min-height:100vh;}
  @media (max-width:820px){ .app-shell{flex-direction:column;} }

  .nav-vertical{
    width:216px;flex-shrink:0;background:var(--teal-deep);color:#fff;
    display:flex;flex-direction:column;padding:22px 16px;gap:4px;
  }
  @media (max-width:820px){
    .nav-vertical{width:100%;flex-direction:row;align-items:center;overflow-x:auto;padding:12px 16px;gap:8px;}
    .nav-vertical .brand{margin-bottom:0;margin-left:14px;flex-shrink:0;}
  }
  .brand{display:flex;flex-direction:column;gap:2px;margin-bottom:22px;}
  .brand h1{font-size:18px;font-weight:800;margin:0;letter-spacing:.2px;}
  .brand span{font-size:11.5px;color:#BFE0D8;font-weight:500;}
  .nav-tab-btn{
    border:none;background:transparent;color:#CFE8E1;font-family:var(--font);
    font-size:13.5px;font-weight:600;padding:10px 14px;border-radius:9px;cursor:pointer;
    transition:.15s;white-space:nowrap;text-align:right;width:100%;
  }
  .nav-tab-btn.active{background:#fff;color:var(--teal-deep);}
  .nav-tab-btn:not(.active):hover{background:rgba(255,255,255,.12);}

  .content-col{flex:1;min-width:0;display:flex;flex-direction:column;}
  .layout{display:flex;flex:1;min-height:0;}
  @media (max-width:820px){ .layout{flex-direction:column;} }

  .sidebar{
    width:320px;flex-shrink:0;background:var(--card);border-left:1px solid var(--line);
    display:flex;flex-direction:column;max-height:calc(100vh - 66px);
  }
  @media (max-width:820px){ .sidebar{width:100%;max-height:none;} }
  .sidebar.hidden-panel{display:none;}

  .sidebar-head{padding:14px 16px 10px;border-bottom:1px solid var(--line);}
  .search{
    width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;
    font-family:var(--font);font-size:13.5px;background:var(--paper);
  }
  .search:focus{outline:2px solid var(--teal);outline-offset:1px;}

  .client-list{overflow-y:auto;padding:8px;}
  .client-item{
    padding:7px 12px;border-radius:10px;cursor:pointer;margin-bottom:2px;
    border:1px solid transparent;transition:.12s;
  }
  .client-item:hover{background:var(--paper);}
  .client-item.selected{background:var(--teal-tint);border-color:var(--teal);}
  .ci-top{display:flex;justify-content:space-between;align-items:center;gap:6px;}
  .ci-name{font-weight:700;font-size:12.5px;}
  .ci-phone{font-size:10.5px;color:var(--ink-soft);margin-top:1px;direction:ltr;text-align:right;}
  .badge{font-size:9.5px;font-weight:700;padding:1px 7px;border-radius:999px;white-space:nowrap;}
  .badge.overdue{background:var(--brick-tint);color:var(--brick);}
  .badge.today{background:var(--amber-tint);color:var(--amber);}
  .badge.upcoming{background:var(--teal-tint);color:var(--teal-deep);}
  .badge.none{background:#EEE;color:#888;}
  .badge.completed{background:var(--gold-tint);color:var(--gold);}
  .badge.awaiting{background:var(--violet-tint);color:var(--violet);}
  .empty-note{padding:24px 16px;color:var(--ink-soft);font-size:13px;text-align:center;line-height:2;}

  .main{flex:1;padding:22px 26px;overflow-y:auto;}
  .main.full-bleed{padding:0;overflow:hidden;}
  .placeholder{
    height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:var(--ink-soft);text-align:center;gap:10px;
  }
  .placeholder b{color:var(--ink);font-size:16px;}

  .client-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:16px;}
  .client-header{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;}
  .client-header h2{margin:0 0 4px;font-size:20px;font-weight:800;}
  .meta-row{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;color:var(--ink-soft);font-size:13px;}
  .meta-row b{color:var(--ink);font-weight:600;}
  .pill-select{
    padding:6px 10px;border-radius:8px;border:1px solid var(--line);font-family:var(--font);
    font-size:12.5px;background:var(--paper);cursor:pointer;
  }
  .icon-btn{
    border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;
    font-family:var(--font);font-size:12.5px;cursor:pointer;font-weight:600;color:var(--ink-soft);
  }
  .icon-btn:hover{border-color:var(--brick);color:var(--brick);}
  .icon-btn.gold{color:var(--gold);border-color:var(--gold-tint);}
  .icon-btn.gold:hover{background:var(--gold-tint);}
  .icon-btn.violet{color:var(--violet);border-color:var(--violet-tint);}
  .icon-btn.violet:hover{background:var(--violet-tint);}

  .next-box{
    margin-top:16px;border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;
    align-items:center;gap:10px;flex-wrap:wrap;
  }
  .next-box.overdue{background:var(--brick-tint);}
  .next-box.today{background:var(--amber-tint);}
  .next-box.upcoming{background:var(--teal-tint);}
  .next-box.none{background:var(--paper);}
  .next-box.completed{background:var(--gold-tint);}
  .next-box.awaiting{background:var(--violet-tint);}
  .next-box .lbl{font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-bottom:3px;}
  .next-box .val{font-size:14.5px;font-weight:700;}
  .next-box .plan{font-size:13px;color:var(--ink-soft);margin-top:2px;}

  .section-title{font-size:14.5px;font-weight:800;margin:22px 2px 10px;display:flex;align-items:center;gap:8px;}
  .section-title .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);}

  .log-form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .form-grid>*{min-width:0;}
  @media (max-width:600px){ .form-grid{grid-template-columns:1fr;} }
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:12px;font-weight:700;color:var(--ink-soft);}
  .field input, .field textarea, .field select{
    font-family:var(--font);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13.5px;
    background:var(--paper);
  }
  .field textarea{resize:vertical;min-height:56px;}
  .full{grid-column:1/-1;}
  .save-log-btn{
    margin-top:14px;padding:10px 22px;border:none;border-radius:9px;background:var(--teal);
    color:#fff;font-family:var(--font);font-weight:700;font-size:13.5px;cursor:pointer;
  }
  .save-log-btn:hover{background:var(--teal-deep);}

  .date-picker{
    display:flex;gap:2px;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:2px;
  }
  .date-picker select{
    flex:1;min-width:0;border:none;background:transparent;padding:7px 9px;
    font-family:var(--font);font-size:13.5px;border-radius:6px;color:var(--ink);
  }
  .date-picker select:focus{outline:2px solid var(--teal-tint);outline-offset:-1px;}

  .timeline{position:relative;margin-top:16px;padding-inline-start:0;}
  .t-entry{position:relative;padding-inline-end:26px;padding-bottom:20px;}
  .t-entry:not(:last-child)::before{
    content:"";position:absolute;top:16px;right:6px;bottom:-4px;width:2px;background:var(--line);
  }
  .t-dot{position:absolute;top:2px;right:0;width:13px;height:13px;border-radius:50%;background:var(--teal);border:3px solid var(--teal-tint);}
  .t-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 16px;}
  .t-date{font-size:12px;font-weight:700;color:var(--teal-deep);}
  .t-note{font-size:13.5px;margin-top:5px;line-height:1.9;}
  .t-next{margin-top:8px;font-size:12px;color:var(--ink-soft);background:var(--paper);border-radius:8px;padding:6px 10px;display:inline-block;}
  .no-log{color:var(--ink-soft);font-size:13px;padding:14px 4px;}

  .reg-page{max-width:520px;}
  .reg-page-wide{max-width:980px;}
  .reg-title{font-size:18px;font-weight:800;margin-bottom:4px;}
  .reg-sub{font-size:13px;color:var(--ink-soft);margin-bottom:18px;}
  .reg-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 24px;}
  .add-layout{display:flex;gap:20px;align-items:flex-start;}
  .add-layout>div{flex:1;min-width:0;}
  @media (max-width:900px){ .add-layout{flex-direction:column;} }
  .reg-actions{display:flex;justify-content:flex-end;margin-top:6px;position:sticky;bottom:0;background:var(--paper);padding:12px 0;z-index:15;border-top:1px solid var(--line);}
  .reg-save{padding:11px 26px;border:none;border-radius:9px;background:var(--teal);color:#fff;font-family:var(--font);font-weight:700;font-size:14px;cursor:pointer;}
  .reg-save:hover{background:var(--teal-deep);}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--teal-deep);color:#fff;
    padding:10px 20px;border-radius:9px;font-size:13px;font-weight:600;z-index:100;opacity:0;transition:.25s;pointer-events:none;
  }
  .toast.show{opacity:1;}

  .followup-banner{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:#FFF3D6;color:#8A5A00;border-bottom:1px solid #F2D99A;
    padding:10px 20px;font-size:13.5px;font-weight:600;
  }
  .followup-banner button{
    background:none;border:none;color:#8A5A00;font-size:15px;cursor:pointer;line-height:1;padding:4px;opacity:.7;
  }
  .followup-banner button:hover{opacity:1;}

  .who-tag{font-size:11px;color:var(--ink-soft);margin-top:6px;}
  .nav-spacer{flex:1;}
  .nav-tab-btn.logout-btn{color:#F3C9C4;}
  .nav-tab-btn.logout-btn:hover{background:rgba(169,62,55,.35);}
  .nav-user{font-size:11.5px;color:#BFE0D8;padding:4px 14px 14px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:8px;}
  @media (max-width:820px){ .nav-spacer{display:none;} .nav-user{border:none;padding:0 8px;margin:0;} }

  .login-overlay{
    position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;justify-content:center;
    z-index:200;padding:16px;font-family:var(--font);direction:rtl;
  }
  .login-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:30px 28px;width:360px;max-width:100%;text-align:center;}
  .login-card h2{margin:0 0 6px;font-size:18px;font-weight:800;color:var(--ink);}
  .login-card p{margin:0 0 18px;font-size:13px;color:var(--ink-soft);}
  .login-card input{
    width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-family:var(--font);
    font-size:14px;background:var(--paper);margin-bottom:12px;text-align:center;
  }
  .login-card button{
    width:100%;padding:11px;border:none;border-radius:9px;background:var(--teal);color:#fff;
    font-family:var(--font);font-weight:700;font-size:14px;cursor:pointer;
  }
  .login-card button:hover{background:var(--teal-deep);}
</style>

    </div>
  </div>
</div>

<script>
/* ===================== تقویم جلالی (شمسی) ===================== */
function div_(a,b){return ~~(a/b);}
function mod_(a,b){return a-~~(a/b)*b;}
function jalCal(jy){
  var breaks=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
  var bl=breaks.length, gy=jy+621, leapJ=-14, jp=breaks[0], jm,jump,leap,n,i;
  for(i=1;i<bl;i+=1){ jm=breaks[i]; jump=jm-jp; if(jy<jm) break;
    leapJ=leapJ+div_(jump,33)*8+div_(mod_(jump,33),4); jp=jm; }
  n=jy-jp;
  leapJ=leapJ+div_(n,33)*8+div_(mod_(n,33)+3,4);
  if(mod_(jump,33)===4 && jump-n===4) leapJ+=1;
  var leapG=div_(gy,4)-div_((div_(gy,100)+1)*3,4)-150;
  var march=20+leapJ-leapG;
  if(jump-n<6) n=n-jump+div_(jump+4,33)*33;
  leap=mod_(mod_(n+1,33)-1,4); if(leap===-1) leap=4;
  return {leap:leap,gy:gy,march:march};
}
function g2d(gy,gm,gd){
  var d=div_((gy+div_(gm-8,6)+100100)*1461,4)+div_(153*mod_(gm+9,12)+2,5)+gd-34840408;
  d=d-div_(div_(gy+100100+div_(gm-8,6),100)*3,4)+752;
  return d;
}
function d2g(jdn){
  var j=4*jdn+139361631;
  j=j+div_(div_(4*jdn+183187720,146097)*3,4)*4-3908;
  var i=div_(mod_(j,1461),4)*5+308;
  var gd=div_(mod_(i,153),5)+1;
  var gm=mod_(div_(i,153),12)+1;
  var gy=div_(j,1461)-100100+div_(8-gm,6);
  return {gy:gy,gm:gm,gd:gd};
}
function j2d(jy,jm,jd){
  var r=jalCal(jy);
  return g2d(r.gy,3,r.march)+(jm-1)*31-div_(jm,7)*(jm-7)+jd-1;
}
function d2j(jdn){
  var gy=d2g(jdn).gy, jy=gy-621, r=jalCal(jy), jdn1f=g2d(gy,3,r.march);
  var jd,jm,k;
  k=jdn-jdn1f;
  if(k>=0){
    if(k<=185){ jm=1+div_(k,31); jd=mod_(k,31)+1; return {jy:jy,jm:jm,jd:jd}; }
    else k-=186;
  } else { jy-=1; k+=179; if(r.leap===1) k+=1; }
  jm=7+div_(k,30); jd=mod_(k,30)+1;
  return {jy:jy,jm:jm,jd:jd};
}
function toJalaali(gy,gm,gd){ return d2j(g2d(gy,gm,gd)); }
function toGregorian(jy,jm,jd){ return d2g(j2d(jy,jm,jd)); }
function isLeapJalaaliYear(jy){ return jalCal(jy).leap===0; }
function jalaaliMonthDays(jy,jm){ if(jm<=6) return 31; if(jm<=11) return 30; return isLeapJalaaliYear(jy)?30:29; }
const JMONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];

function pad2(n){ return String(n).padStart(2,'0'); }
function isoFromJalali(jy,jm,jd){
  if(!jy||!jm||!jd) return null;
  const g=toGregorian(jy,jm,jd);
  return `${g.gy}-${pad2(g.gm)}-${pad2(g.gd)}`;
}
function jalaliFromIso(iso){
  if(!iso) return null;
  const [gy,gm,gd]=iso.split('-').map(Number);
  return toJalaali(gy,gm,gd);
}
function todayJalali(){
  const d=new Date();
  return toJalaali(d.getFullYear(), d.getMonth()+1, d.getDate());
}
function todayStr(){
  const d=new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}
function fmtDate(iso){
  if(!iso) return '';
  const j=jalaliFromIso(iso);
  return `${j.jd} ${JMONTHS[j.jm-1]} ${j.jy}`;
}
function fmtMoney(v){
  if(v===undefined||v===null||v==='') return '—';
  const n=Number(String(v).replace(/[^0-9.-]/g,''));
  if(isNaN(n)) return v;
  return n.toLocaleString('en-US')+' تومان';
}
function plainMoney(v){
  if(v===undefined||v===null||v==='') return '';
  const digits=String(v).replace(/[^\d]/g,'');
  return digits ? Number(digits).toLocaleString('en-US') : '';
}
function attachMoneyInput(id){
  const el=document.getElementById(id);
  if(!el) return;
  el.addEventListener('input', ()=>{
    const digits=el.value.replace(/[^\d]/g,'');
    el.value = digits ? Number(digits).toLocaleString('en-US') : '';
  });
}
function readMoneyInput(id){
  const el=document.getElementById(id);
  if(!el) return '';
  return el.value.replace(/[^\d]/g,'');
}
function daysDiff(iso){
  if(!iso) return null;
  const [gy,gm,gd]=iso.split('-').map(Number);
  const a=new Date(); a.setHours(0,0,0,0);
  const b=new Date(gy,gm-1,gd);
  return Math.round((b-a)/86400000);
}

/* ===== date picker component (day/month/year selects, jalali) ===== */
function buildDatePicker(idPrefix, iso){
  const j = iso ? jalaliFromIso(iso) : {jy:'',jm:'',jd:''};
  const ty = todayJalali().jy;
  let yearsOpts = '<option value="">سال</option>';
  for(let y=ty-2;y<=ty+3;y++){ yearsOpts += `<option value="${y}" ${y===j.jy?'selected':''}>${y}</option>`; }
  let monthOpts = '<option value="">ماه</option>';
  JMONTHS.forEach((m,i)=>{ monthOpts += `<option value="${i+1}" ${i+1===j.jm?'selected':''}>${m}</option>`; });
  let dayOpts = '<option value="">روز</option>';
  const maxDay = (j.jy && j.jm) ? jalaaliMonthDays(j.jy,j.jm) : 31;
  for(let d=1;d<=maxDay;d++){ dayOpts += `<option value="${d}" ${d===j.jd?'selected':''}>${d}</option>`; }
  return `<div class="date-picker" data-prefix="${idPrefix}">
    <select id="${idPrefix}_d">${dayOpts}</select>
    <select id="${idPrefix}_m">${monthOpts}</select>

async function sGet(key, shared){
  if(!shared){
    try{ const raw=localStorage.getItem('lf_'+key); return raw!==null ? {key, value:raw, shared} : null; }catch(e){ return null; }

    });
    if(!r.ok) return null;
    const rows = await r.json();
    if(!rows.length) return null;
    return { key, value: rows[0].value, shared };
  }catch(e){ return null; }
}
async function sSet(key, value, shared){
  if(!shared){
    try{ localStorage.setItem('lf_'+key, value); return {key, value, shared}; }catch(e){ return null; }
  }
  if(!backendConfigured) return null;
  try{
    const r = await fetch(`${SUPABASE_URL}/rest/v1/kv_store?on_conflict=key`, {
      method: 'POST',

        apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates'
      },
      body: JSON.stringify([{ key, value, updated_at: new Date().toISOString() }])

}

async function sha256(text){
  const enc=new TextEncoder().encode(text);
  const buf=await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* ===================== تایید دومرحله‌ای (TOTP - سازگار با Google Authenticator / Authy) ===================== */
const B32_ALPHABET='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
function base32Encode(bytes){
  let bits='', out='';
  for(const b of bytes) bits += b.toString(2).padStart(8,'0');
  for(let i=0;i+5<=bits.length;i+=5) out += B32_ALPHABET[parseInt(bits.substr(i,5),2)];
  const rem=bits.length%5;
  if(rem) out += B32_ALPHABET[parseInt(bits.substr(bits.length-rem).padEnd(5,'0'),2)];
  return out;
}
function base32Decode(str){
  str=str.replace(/=+$/,'').toUpperCase().replace(/\s/g,'');
  let bits='';
  for(const c of str){ const idx=B32_ALPHABET.indexOf(c); if(idx===-1) continue; bits+=idx.toString(2).padStart(5,'0'); }
  const bytes=[];
  for(let i=0;i+8<=bits.length;i+=8) bytes.push(parseInt(bits.substr(i,8),2));
  return new Uint8Array(bytes);
}
function generateTotpSecret(){
  const bytes=new Uint8Array(20);
  crypto.getRandomValues(bytes);
  return base32Encode(bytes);
}
async function hotp(secretBytes, counter){
  const key=await crypto.subtle.importKey('raw', secretBytes, {name:'HMAC', hash:'SHA-1'}, false, ['sign']);
  const buf=new ArrayBuffer(8);
  const view=new DataView(buf);
  const high=Math.floor(counter/Math.pow(2,32));
  const low=counter>>>0;
  view.setUint32(0, high);
  view.setUint32(4, low);
  const sig=await crypto.subtle.sign('HMAC', key, buf);
  const b=new Uint8Array(sig);
  const offset=b[b.length-1]&0xf;
  const code=((b[offset]&0x7f)<<24)|((b[offset+1]&0xff)<<16)|((b[offset+2]&0xff)<<8)|(b[offset+3]&0xff);
  return (code%1000000).toString().padStart(6,'0');
}
async function totpCode(secretBase32, forTime){
  const counter=Math.floor((forTime===undefined?Date.now():forTime)/1000/30);
  return hotp(base32Decode(secretBase32), counter);
}
async function verifyTotp(secretBase32, token){
  if(!token || !/^\d{6}$/.test(token)) return false;
  const now=Date.now();
  for(const delta of [0,-1,1,-2,2]){
    if((await totpCode(secretBase32, now+delta*30000))===token) return true;
  }
  return false;
}

function showToast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(showToast._h); showToast._h=setTimeout(()=>t.classList.remove('show'),2200);
}
function clientNextInfo(c){
  const logs=c.followups||[];
  if(logs.length===0) return {nextDate:null, plan:null};
  const last=logs[logs.length-1];
  return {nextDate:last.nextDate||null, plan:last.nextPlan||null};
}

/* ===================== نوتیفیکیشن پیگیری روز ===================== */
function dueFollowupEntries(){
  return visibleClients()
    .filter(c=>c.status!=='completed' && c.status!=='awaiting')
    .map(c=>({c, next:clientNextInfo(c)}))
    .filter(e=>{
      if(!e.next.nextDate) return false;
      const st=statusOf(e.next.nextDate, e.c.status);
      return st==='overdue' || st==='today';
    });
}
function checkFollowupNotifications(){
  if(!currentUsername) return;
  const due = dueFollowupEntries();
  const banner=$('#followupBanner'), text=$('#followupBannerText');
  if(due.length>0){
    text.textContent = due.length===1
      ? `پیگیری «${due[0].c.name}» برای امروزه.`
      : `${due.length} مشتری پیگیری امروز یا عقب‌افتاده دارن.`;
    banner.style.display='flex';
  } else {
    banner.style.display='none';
  }

  if(!('Notification' in window)) return;
  const dayKey='followupNotified_'+currentUsername+'_'+todayStr();
  let notifiedIds=[];
  try{ notifiedIds=JSON.parse(localStorage.getItem(dayKey)||'[]'); }catch(e){ notifiedIds=[]; }
  const newOnes = due.filter(e=>!notifiedIds.includes(e.c.id));
  if(newOnes.length===0) return;

  const markNotified=()=>{ try{ localStorage.setItem(dayKey, JSON.stringify([...notifiedIds, ...newOnes.map(e=>e.c.id)])); }catch(e){} };
  const fire=()=>{
    try{
      const title = newOnes.length===1 ? 'یادآوری پیگیری مشتری' : `یادآوری پیگیری ${newOnes.length} مشتری`;
      const body = newOnes.length===1
        ? `پیگیری «${newOnes[0].c.name}» برای امروزه.`
        : newOnes.slice(0,3).map(e=>e.c.name).join('، ') + (newOnes.length>3?' و دیگران':'') + ' — پیگیری امروز دارن.';
      new Notification(title, {body, tag:'followup-'+todayStr()});
    }catch(e){}
    markNotified();
  };
  if(Notification.permission==='granted'){ fire(); }
  else if(Notification.permission!=='denied'){
    Notification.requestPermission().then(p=>{ if(p==='granted') fire(); else markNotified(); });
  } else {
    markNotified();
  }
}

let ownerFilter='all';

function assignedOf(c){ return c.assignedTo || c.createdByUsername || null; }
function ownerName(username){
  if(!username) return 'نامشخص';
  if(ADMIN && username===ADMIN.username) return (ADMIN.name||username)+' (مدیر)';
  if(USERS[username]) return USERS[username].name||username;
  return username;
}
function ownerDirectory(){
  const counts={};
  Object.values(DATA.clients).forEach(c=>{
    const u=assignedOf(c)||'__unknown__';
    counts[u]=(counts[u]||0)+1;
  });
  const list=[];
  if(ADMIN){ list.push({username:ADMIN.username, name:ownerName(ADMIN.username), count:counts[ADMIN.username]||0}); }
  Object.keys(USERS).forEach(u=>{ list.push({username:u, name:ownerName(u), count:counts[u]||0}); });
  return list.sort((a,b)=>a.name.localeCompare(b.name,'fa'));
}
function renderOwnerFilter(){
  const sel=$('#ownerFilter');
  if(!isAdmin || currentTab==='add' || currentTab==='users' || currentTab==='marketers'){ sel.style.display='none'; return; }
  const owners=ownerDirectory();
  if(owners.length<2){ sel.style.display='none'; ownerFilter='all'; return; }
  sel.style.display='block';
  sel.innerHTML = `<option value="all">همه کاربران (${Object.keys(DATA.clients).length})</option>` +
    owners.map(o=>`<option value="${o.username}">${o.name} (${o.count})</option>`).join('');
  sel.value=ownerFilter;
}
$('#ownerFilter').addEventListener('change', ()=>{ ownerFilter=$('#ownerFilter').value; renderList(); renderMain(); });

function visibleClients(){
  const all=Object.values(DATA.clients);
  if(!isAdmin) return all.filter(c=>assignedOf(c)===currentUsername);
  if(ownerFilter==='all') return all;
  if(ownerFilter==='__unknown__') return all.filter(c=>!assignedOf(c));
  return all.filter(c=>assignedOf(c)===ownerFilter);
}

function renderList(){
  $('#addMarketerBtn').style.display = currentTab==='marketers' ? 'block' : 'none';
  renderOwnerFilter();
  if(currentTab==='marketers'){ renderMarketerList(); return; }
  const list=$('#clientList'); list.innerHTML='';
  const q=$('#searchBox').value.trim();
  let entries=visibleClients().filter(c=>!q || c.name.includes(q) || (c.phone||'').includes(q) || (c.nationalId||'').includes(q));
  entries=entries.map(c=>({c,next:clientNextInfo(c)}));

  if(currentTab==='today'){
    entries=entries.filter(e=>e.c.status!=='completed' && e.next.nextDate && (statusOf(e.next.nextDate,e.c.status)==='overdue' || statusOf(e.next.nextDate,e.c.status)==='today'));
    entries.sort((a,b)=>(a.next.nextDate||'').localeCompare(b.next.nextDate||''));
  } else if(currentTab==='done'){
    entries=entries.filter(e=>e.c.status==='completed' && marketOf(e.c)==='securities');
    entries.sort((a,b)=>(b.c.completedDate||'').localeCompare(a.c.completedDate||''));
  } else if(currentTab==='kala'){
    entries=entries.filter(e=>e.c.status==='completed' && marketOf(e.c)==='kala');
    entries.sort((a,b)=>(b.c.completedDate||'').localeCompare(a.c.completedDate||''));
  } else if(currentTab==='energy'){
    entries=entries.filter(e=>e.c.status==='completed' && marketOf(e.c)==='energy');
    entries.sort((a,b)=>(b.c.completedDate||'').localeCompare(a.c.completedDate||''));
  } else if(currentTab==='awaiting'){
    entries=entries.filter(e=>e.c.status==='awaiting' && isDueOrOverdue(e.next.nextDate));
    entries.sort((a,b)=>(b.c.createdAt||'').localeCompare(a.c.createdAt||''));
  } else if(currentTab==='future'){
    entries=entries.filter(e=>e.c.status!=='completed' && e.next.nextDate && daysDiff(e.next.nextDate) > 0);
    entries.sort((a,b)=>(a.next.nextDate||'').localeCompare(b.next.nextDate||''));
  } else if(currentTab==='all'){
    entries=entries.filter(e=>e.c.status!=='completed' && e.c.nazerStatus && e.c.nazerStatus!=='none');
    entries.sort((a,b)=>a.c.name.localeCompare(b.c.name,'fa'));
  } else {
    entries=[];
  }

  if(entries.length===0){
    let msg='هیچ مشتری‌ای اینجا نیست.';
    if(currentTab==='today') msg='هیچ پیگیری عقب‌افتاده یا برای امروز نداری. عالیه! 🌿';
    if(currentTab==='all') msg='هیچ مشتری‌ای دارای تغییر ناظر نیست.';
    if(currentTab==='awaiting') msg='مشتری‌ای در حال پیگیری نیست.';
    if(currentTab==='future') msg='هیچ پیگیری آینده‌ای ثبت نشده.';
    if(currentTab==='done') msg='هنوز هیچ مشتری‌ای تکمیل ثبت‌نام نشده.';
    if(currentTab==='kala') msg='هنوز هیچ مشتری بورس کالایی تکمیل ثبت‌نام نشده.';
    if(currentTab==='energy') msg='هنوز هیچ مشتری بورس انرژی‌ای تکمیل ثبت‌نام نشده.';
    list.appendChild(el('div','empty-note',msg));
    return;
  }
  entries.forEach(({c,next})=>{
    const st=statusOf(next.nextDate, c.status);
    const item=el('div','client-item'+(c.id===selectedId?' selected':''));
    item.innerHTML=`<div class="ci-top"><span class="ci-name">${c.name}</span><span class="badge ${st}">${statusLabel[st]}</span></div><div class="ci-phone">${c.phone||''}</div>`;
    item.addEventListener('click', ()=>{ selectedId=c.id; renderMain(); renderList(); });
    list.appendChild(item);
  });
}

            <option value="inactive" ${m.status==='inactive'?'selected':''}>غیرفعال</option>
          </select>
        </div>
        <div class="field full"><label>نوع قرارداد / توضیحات همکاری</label><textarea id="eContract">${m.contractType||''}</textarea></div>
      </div>
      <div class="reg-actions" style="margin-top:14px;"><button class="reg-save" id="eSave">ذخیره تغییرات</button></div>
    </div>

    <div class="section-title"><span class="dot"></span> ثبت نتیجه پیگیری جدید</div>
    <div class="log-form">
      <div class="form-grid">
        <div class="field"><label>تاریخ تماس</label>${buildDatePicker('bDate', todayStr())}</div>
        <div class="field"><label>تاریخ پیگیری بعدی</label>${buildDatePicker('bNextDate', next.nextDate)}</div>
        <div class="field full"><label>نتیجه پیگیری</label><textarea id="bNote" placeholder="نتیجه‌ی تماس یا جلسه با بازاریاب..."></textarea></div>
        <div class="field full"><label>برنامه برای دفعه بعد</label><textarea id="bPlan" placeholder="مثلاً: ارسال قرارداد جدید، پیگیری تسویه کمیسیون...">${next.plan||''}</textarea></div>
      </div>
      <button class="save-log-btn" id="bLogBtn">ثبت پیگیری</button>
    </div>

    <div class="section-title"><span class="dot"></span> تاریخچه پیگیری‌ها</div>
    <div class="timeline" id="bTimeline"></div>
  `;
  main.appendChild(wrap);

  const logs=(m.followups||[]).slice().reverse();
  const tl=wrap.querySelector('#bTimeline');
  if(logs.length===0){ tl.appendChild(el('div','no-log','هنوز پیگیری‌ای برای این بازاریاب ثبت نشده.')); }
  else{
    logs.forEach(l=>{
      const entry=el('div','t-entry');
      entry.innerHTML=`<div class="t-dot"></div><div class="t-card"><div class="t-date">${fmtDate(l.date)}${l.by?' — '+l.by:''}</div><div class="t-note">${l.note}</div>${l.nextPlan?`<div class="t-next">برنامه بعدی: ${l.nextPlan}${l.nextDate?' — '+fmtDate(l.nextDate):''}</div>`:''}</div>`;
      tl.appendChild(entry);
    });
  }

  wrap.querySelector('#eSave').addEventListener('click', ()=>{
    const name=wrap.querySelector('#eName').value.trim();
    if(!name){ showToast('نام بازاریاب رو وارد کن'); return; }
    m.name=name;
    m.phone=wrap.querySelector('#ePhone').value.trim();
    m.commissionPercent=wrap.querySelector('#eCommission').value.trim();
    m.status=wrap.querySelector('#eStatus').value;
    m.contractType=wrap.querySelector('#eContract').value.trim();
    render();
    showToast('تغییرات ذخیره شد');
    saveData();
  });

  wrap.querySelector('#bLogBtn').addEventListener('click', ()=>{
    const note=wrap.querySelector('#bNote').value.trim();
    if(!note){ showToast('نتیجه‌ی پیگیری رو بنویس'); return; }
    const date = readDatePicker('bDate') || todayStr();
    const nextDate = readDatePicker('bNextDate');
    const nextPlan = wrap.querySelector('#bPlan').value.trim() || null;
    m.followups = m.followups || [];
    m.followups.push({id:'f'+Date.now(), date, note, nextDate, nextPlan, by: currentUser || null});
    render();
    showToast('پیگیری ثبت شد');
    saveData();
  });

  wrap.querySelector('#delMarketerBtn').addEventListener('click', ()=>{
    if(!confirm('این بازاریاب حذف بشه؟ این کار قابل بازگشت نیست.')) return;
    delete DATA.marketers[m.id];
    selectedMarketerId=null;
    render();
    saveData();
  });
}

function renderEditClientForm(c){
  const main=$('#main'); main.innerHTML='';
  const wrap=el('div','reg-page');
  wrap.innerHTML=`
    <div class="reg-title">ویرایش اطلاعات مشتری</div>
    <div class="reg-sub">اطلاعات رو اصلاح کن و ذخیره کن. وضعیت پیگیری و تاریخچه‌ی تماس‌ها تغییری نمی‌کنه.</div>
    <div class="add-layout">
      <div>
        <div class="reg-card">
          <div class="field" style="margin-bottom:12px;"><label>نام مشتری</label><input id="eName" value="${c.name||''}" placeholder="مثلاً: عادل رضایی"></div>
          <div class="field" style="margin-bottom:12px;"><label>شماره تماس</label><input id="ePhone" value="${c.phone||''}" placeholder="0912xxxxxxx" style="direction:ltr;text-align:right;"></div>
          <div class="field" style="margin-bottom:12px;"><label>کد ملی</label><input id="eNationalId" value="${c.nationalId||''}" placeholder="0000000000" style="direction:ltr;text-align:right;" maxlength="10"></div>
          <div class="field" style="margin-bottom:6px;"><label>معرف</label>
            <select id="eSource">
              <option value="mobin">انتقالی از مبین سرمایه</option>
              <option value="pouyan_inactive">غیرفعال پویان</option>
              ${marketerOptionsHtml()}
              <option value="other">سایر</option>
            </select>
          </div>
          <div class="field" style="margin-top:12px;"><label>تغییر ناظر</label>
            <select id="eNazerStatus">
              <option value="none">ثبت اولیه</option>
              <option value="pending">در حال پردازش</option>
              <option value="done">تکمیل‌شده</option>
            </select>
          </div>
          <div class="field" style="margin-top:12px;"><label>نوع مشتری</label>
            <select id="eMarket">
              <option value="securities">بورس اوراق</option>
              <option value="kala">بورس کالا</option>
              <option value="energy">بورس انرژی</option>
            </select>
          </div>
        </div>
        <div class="reg-card" style="margin-top:16px;">
          <div class="section-title" style="margin-top:0;margin-bottom:14px;"><span class="dot"></span> اطلاعات مالی</div>
          <div class="form-grid">
            <div class="field"><label>مبلغ اعتبار درخواستی (تومان)</label><input id="eReqCredit" value="${plainMoney(c.requestedCredit)}" inputmode="numeric" placeholder="0" style="direction:ltr;text-align:right;"></div>
            <div class="field"><label>مبلغ اعتبار در کارگزاری قبلی (تومان)</label><input id="ePrevCredit" value="${plainMoney(c.prevBrokerCredit)}" inputmode="numeric" placeholder="0" style="direction:ltr;text-align:right;"></div>
            <div class="field"><label>کارمزد ماهیانه (تومان)</label><input id="eMonthlyFee" value="${plainMoney(c.monthlyFee)}" inputmode="numeric" placeholder="0" style="direction:ltr;text-align:right;"></div>
            <div class="field"><label>مبلغ اعتبار سرخطی (شارژ آنلاین) (تومان)</label><input id="eOnlineCredit" value="${plainMoney(c.onlineChargeCredit)}" inputmode="numeric" placeholder="0" style="direction:ltr;text-align:right;"></div>
            <div class="field"><label>پرتفوی مشتری (تومان)</label><input id="ePortfolioValue" value="${plainMoney(c.portfolioValue)}" inputmode="numeric" placeholder="0" style="direction:ltr;text-align:right;"></div>
            <div class="field full"><label>اکسل گردش حساب مشتری${c.excelFile ? ' (فایل فعلی: '+c.excelFile.name+')' : ''}</label><input type="file" id="eExcelFile" accept=".xlsx,.xls,.csv"><div id="eExcelFileName" style="font-size:12px;color:var(--ink-soft);margin-top:4px;"></div></div>
            <div class="field full"><label>اکسل پرتفوی مشتری${c.portfolioExcelFile ? ' (فایل فعلی: '+c.portfolioExcelFile.name+')' : ''}</label><input type="file" id="ePortfolioExcelFile" accept=".xlsx,.xls,.csv"><div id="ePortfolioExcelFileName" style="font-size:12px;color:var(--ink-soft);margin-top:4px;"></div></div>
          </div>
        </div>
      </div>
    </div>
    <div class="reg-actions">
      <button class="icon-btn" id="editCancelBtn">انصراف</button>
      <button class="reg-save" id="editSaveBtn">ذخیره تغییرات</button>
    </div>
  `;
  main.appendChild(wrap);
  wrap.querySelector('#eSource').value = c.source||'other';
  wrap.querySelector('#eNazerStatus').value = c.nazerStatus||'none';
  wrap.querySelector('#eMarket').value = marketOf(c);
  ['eReqCredit','ePrevCredit','eMonthlyFee','eOnlineCredit','ePortfolioValue'].forEach(attachMoneyInput);

  let pendingEditExcel = undefined;
  wrap.querySelector('#eExcelFile').addEventListener('change', (e)=>{
    const file=e.target.files[0];
    if(!file){ pendingEditExcel=undefined; wrap.querySelector('#eExcelFileName').textContent=''; return; }
    if(file.size > 3*1024*1024){ showToast('حجم فایل باید کمتر از ۳ مگابایت باشه'); e.target.value=''; pendingEditExcel=undefined; wrap.querySelector('#eExcelFileName').textContent=''; return; }
    const reader=new FileReader();
    reader.onload=()=>{
      pendingEditExcel={name:file.name, data:reader.result, uploadedAt: todayStr()};
      wrap.querySelector('#eExcelFileName').textContent='فایل جدید انتخاب شد: '+file.name;
    };
    reader.onerror=()=>{ showToast('خطا در خواندن فایل'); pendingEditExcel=undefined; };
    reader.readAsDataURL(file);
  });

  let pendingEditPortfolioExcel = undefined;
  wrap.querySelector('#ePortfolioExcelFile').addEventListener('change', (e)=>{
    const file=e.target.files[0];
    if(!file){ pendingEditPortfolioExcel=undefined; wrap.querySelector('#ePortfolioExcelFileName').textContent=''; return; }
    if(file.size > 3*1024*1024){ showToast('حجم فایل باید کمتر از ۳ مگابایت باشه'); e.target.value=''; pendingEditPortfolioExcel=undefined; wrap.querySelector('#ePortfolioExcelFileName').textContent=''; return; }
    const reader=new FileReader();
    reader.onload=()=>{
      pendingEditPortfolioExcel={name:file.name, data:reader.result, uploadedAt: todayStr()};
      wrap.querySelector('#ePortfolioExcelFileName').textContent='فایل جدید انتخاب شد: '+file.name;
    };
    reader.onerror=()=>{ showToast('خطا در خواندن فایل'); pendingEditPortfolioExcel=undefined; };
    reader.readAsDataURL(file);
  });

  wrap.querySelector('#editCancelBtn').addEventListener('click', ()=>{ editingClientId=null; renderMain(); });
  wrap.querySelector('#editSaveBtn').addEventListener('click', async()=>{
    const name=wrap.querySelector('#eName').value.trim();
    if(!name){ showToast('نام مشتری رو وارد کن'); return; }
    const lc=DATA.clients[c.id]; if(!lc){ showToast('خطا — مشتری پیدا نشد'); return; }
    lc.name=name;
    lc.phone=wrap.querySelector('#ePhone').value.trim();
    lc.nationalId=wrap.querySelector('#eNationalId').value.trim();
    lc.source=wrap.querySelector('#eSource').value;
    lc.nazerStatus=wrap.querySelector('#eNazerStatus').value;
    lc.market=wrap.querySelector('#eMarket').value;
    lc.requestedCredit=readMoneyInput('eReqCredit');
    lc.prevBrokerCredit=readMoneyInput('ePrevCredit');
    lc.monthlyFee=readMoneyInput('eMonthlyFee');
    lc.onlineChargeCredit=readMoneyInput('eOnlineCredit');
    lc.portfolioValue=readMoneyInput('ePortfolioValue');
    if(pendingEditExcel!==undefined) lc.excelFile=pendingEditExcel;
    if(pendingEditPortfolioExcel!==undefined) lc.portfolioExcelFile=pendingEditPortfolioExcel;
    editingClientId=null;
    showToast('اطلاعات مشتری به‌روزرسانی شد');
    renderMain(); renderList();
    saveData();
  });
}

  if(!window.__karmozdBlobUrl){
    const binary = atob(KARMOZD_HTML_B64);
    const bytes = new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    const blob = new Blob([bytes], {type:'text/html'});
    window.__karmozdBlobUrl = URL.createObjectURL(blob);
  }
  return window.__karmozdBlobUrl;
}
function renderKarmozdPage(){

function renderMain(){

  if(currentTab==='misc'){ renderMiscPage(); return; }
  if(currentTab==='users'){ renderUsersTab(); return; }
  if(currentTab==='marketers'){ renderMarketerMain(); return; }

  if(currentTab==='security'){ renderSecurityPage(); return; }
  const main=$('#main'); main.innerHTML='';
  const c=DATA.clients[selectedId];
  if(!c || (!isAdmin && assignedOf(c)!==currentUsername)){

    main.appendChild(el('div','placeholder','<b>یه مشتری رو از لیست انتخاب کن</b><span>یا از تب «افزودن مشتری» شروع کن</span>'));

      <div>

          ${c.createdBy ? `<span><b>ثبت‌کننده:</b> ${c.createdBy}</span>` : ''}
          <span><b>مسئول پیگیری:</b> ${ownerName(assignedOf(c))}</span>
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        ${isAdmin ? `<span style="font-size:12.5px;color:var(--ink-soft);">واگذاری پیگیری به:</span><select class="pill-select" id="assignSelect">${ownerDirectory().map(o=>`<option value="${o.username}">${o.name}</option>`).join('')}</select>` : ''}
        <select class="pill-select" id="nazerSelect">
          <option value="none">ثبت اولیه</option>
          <option value="pending">در حال پردازش</option>
          <option value="done">تکمیل‌شده</option>
        </select>
        ${(!isDone && !isAwaiting) ? `<select class="pill-select" id="statusSelect">
          <option value="pending">در حال پیگیری</option>
          <option value="active">فعال</option>
          <option value="inactive">غیرفعال</option>
        </select>` : ''}
        ${isAwaiting ? `<button class="icon-btn violet" id="approveBtn">انتقال به «${MARKET_LABELS[marketOf(c)]}»</button>` : ''}
        ${isDone
          ? `<button class="icon-btn gold" id="undoBtn">بازگردانی به لیست فعال</button>`
          : (!isAwaiting ? `<button class="icon-btn gold" id="completeBtn">✅ تکمیل ثبت‌نام / انتقال به «${MARKET_LABELS[marketOf(c)]}»</button>` : '')}
        <button class="icon-btn" id="editInfoBtn">✏️ ویرایش اطلاعات</button>
        <button class="icon-btn" id="deleteBtn">حذف مشتری</button>
      </div>
    </div>
    <div class="next-box ${st}">
      <div>
        <div class="lbl">${isDone ? 'وضعیت' : 'پیگیری بعدی'}</div>
        <div class="val">${isDone ? 'ثبت‌نام / انتقال تکمیل شده' + (c.completedDate ? ' — '+fmtDate(c.completedDate) : '') : (next.nextDate ? fmtDate(next.nextDate)+' — '+statusLabel[st] : 'برنامه‌ای ثبت نشده')}</div>
        ${(!isDone && next.plan) ? `<div class="plan">${next.plan}</div>` : ''}
      </div>
    </div>
    <div class="section-title" style="margin-bottom:10px;"><span class="dot"></span> اطلاعات مالی</div>
    <div class="reg-card" style="margin-bottom:4px;">
      <div class="meta-row" style="row-gap:10px;">
        <span><b>اعتبار درخواستی:</b> ${fmtMoney(c.requestedCredit)}</span>
        <span><b>اعتبار در کارگزاری قبلی:</b> ${fmtMoney(c.prevBrokerCredit)}</span>
        <span><b>کارمزد ماهیانه:</b> ${fmtMoney(c.monthlyFee)}</span>
        <span><b>اعتبار سرخطی (شارژ آنلاین):</b> ${fmtMoney(c.onlineChargeCredit)}</span>
        <span><b>پرتفوی مشتری:</b> ${fmtMoney(c.portfolioValue)}</span>
      </div>
      ${c.excelFile ? `<div style="margin-top:10px;"><a href="${c.excelFile.data}" download="${c.excelFile.name}" class="icon-btn" style="text-decoration:none;display:inline-block;">📊 دانلود اکسل گردش حساب (${c.excelFile.name})</a></div>` : `<div style="margin-top:10px;color:var(--ink-soft);font-size:13px;">اکسل گردش حسابی آپلود نشده.</div>`}
      ${c.portfolioExcelFile ? `<div style="margin-top:10px;"><a href="${c.portfolioExcelFile.data}" download="${c.portfolioExcelFile.name}" class="icon-btn" style="text-decoration:none;display:inline-block;">📁 دانلود اکسل پرتفوی (${c.portfolioExcelFile.name})</a></div>` : `<div style="margin-top:10px;color:var(--ink-soft);font-size:13px;">اکسل پرتفویی آپلود نشده.</div>`}

  `;
  main.appendChild(card);

  card.querySelector('#nazerSelect').value = c.nazerStatus || 'none';
  card.querySelector('#nazerSelect').addEventListener('change', (e)=>{ const lc=DATA.clients[c.id]; if(!lc) return; lc.nazerStatus=e.target.value; showToast('وضعیت تغییر ناظر به‌روزرسانی شد'); renderList(); saveData(); });

  if(isAdmin){
    const assignSel=card.querySelector('#assignSelect');
    assignSel.value = assignedOf(c) || '';
    assignSel.addEventListener('change', (e)=>{
      const lc=DATA.clients[c.id]; if(!lc) return;
      lc.assignedTo=e.target.value;
      showToast(`مشتری به «${ownerName(lc.assignedTo)}» واگذار شد`);
      renderList(); renderMain();
      saveData();
    });
  }

  if(!isDone && !isAwaiting){
    card.querySelector('#statusSelect').value = c.status || 'pending';
    card.querySelector('#statusSelect').addEventListener('change', (e)=>{ const lc=DATA.clients[c.id]; if(!lc) return; lc.status=e.target.value; showToast('وضعیت به‌روزرسانی شد'); renderList(); saveData(); });
  }
  if(isAwaiting){
    card.querySelector('#approveBtn').addEventListener('click', ()=>{
      const lc=DATA.clients[c.id]; if(!lc) return;
      lc.status='completed'; lc.completedDate=todayStr();
      showToast(`مشتری تایید شد و به «${MARKET_LABELS[marketOf(lc)]}» منتقل شد`);
      renderMain(); renderList();
      saveData();
    });
  }
  if(isDone){
    card.querySelector('#undoBtn').addEventListener('click', ()=>{
      const lc=DATA.clients[c.id]; if(!lc) return;
      lc.status='pending'; delete lc.completedDate;
      showToast('مشتری به لیست فعال برگشت');
      renderMain(); renderList();
      saveData();
    });

      renderMain(); renderList();
      saveData();
    });

      delete DATA.clients[c.id]; selectedId=null;
      renderList(); renderMain();
      showToast('مشتری حذف شد');
      saveData();
    }
  });

  if(!isDone){
    main.appendChild(el('div','section-title','<span class="dot"></span> ثبت نتیجه پیگیری جدید'));
    const form=el('div','log-form');
    form.innerHTML=`
      <div class="form-grid">
        <div class="field"><label>تاریخ تماس</label>${buildDatePicker('fDate', todayStr())}</div>
        <div class="field"><label>تاریخ پیگیری بعدی</label>${buildDatePicker('fNextDate', todayStr())}</div>
        <div class="field full"><label>نتیجه پیگیری</label><textarea id="fNote" placeholder="مثلاً: تماس گرفتم، گفت هفته دیگه تصمیم می‌گیره..."></textarea></div>
        <div class="field full"><label>برنامه برای دفعه بعد</label><textarea id="fPlan" placeholder="مثلاً: یادآوری تماس تلفنی، ارسال فرم انتقال کد..."></textarea></div>
      </div>
      <button class="save-log-btn" id="saveLogBtn">ثبت پیگیری</button>
    `;
    main.appendChild(form);
    form.querySelector('#saveLogBtn').addEventListener('click', ()=>{
      const date = readDatePicker('fDate') || todayStr();
      const note = form.querySelector('#fNote').value.trim();
      const nextDate = readDatePicker('fNextDate');
      const nextPlan = form.querySelector('#fPlan').value.trim() || null;
      if(!note){ showToast('نتیجه پیگیری رو بنویس'); return; }
      const liveC = DATA.clients[c.id] || c;
      liveC.followups=liveC.followups||[];
      liveC.followups.push({id:'f'+Date.now(), date, note, nextDate, nextPlan, by: currentUser || null});
      showToast('پیگیری ثبت شد'); renderMain(); renderList();
      saveData();
    });
  }

  {
    main.appendChild(el('div','section-title','<span class="dot"></span> تاریخچه پیگیری‌ها'));
    const logs=[...(c.followups||[])].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    if(logs.length===0){ main.appendChild(el('div','no-log','هنوز پیگیری‌ای برای این مشتری ثبت نشده.')); }
    else{
      const tl=el('div','timeline');
      logs.forEach(l=>{
        const entry=el('div','t-entry');
        if(editingFollowupId===l.id){
          entry.innerHTML=`<div class="t-dot"></div><div class="t-card">
            <div class="form-grid">
              <div class="field"><label>تاریخ تماس</label>${buildDatePicker('efd_'+l.id, l.date)}</div>
              <div class="field"><label>تاریخ پیگیری بعدی</label>${buildDatePicker('efn_'+l.id, l.nextDate)}</div>
              <div class="field full"><label>نتیجه پیگیری</label><textarea id="efNote_${l.id}">${l.note||''}</textarea></div>
              <div class="field full"><label>برنامه برای دفعه بعد</label><textarea id="efPlan_${l.id}">${l.nextPlan||''}</textarea></div>
            </div>
            <div style="display:flex;gap:8px;margin-top:10px;">
              <button class="icon-btn" id="efCancel_${l.id}">انصراف</button>
              <button class="save-log-btn" id="efSave_${l.id}" style="margin-top:0;">ذخیره</button>
            </div>
          </div>`;
          tl.appendChild(entry);
          entry.querySelector('#efCancel_'+l.id).addEventListener('click', ()=>{ editingFollowupId=null; renderMain(); });
          entry.querySelector('#efSave_'+l.id).addEventListener('click', ()=>{
            const note=entry.querySelector('#efNote_'+l.id).value.trim();
            if(!note){ showToast('نتیجه پیگیری رو بنویس'); return; }
            const lc=DATA.clients[c.id]; if(!lc){ showToast('خطا — مشتری پیدا نشد'); return; }
            const ll=(lc.followups||[]).find(f=>f.id===l.id) || l;
            ll.date=readDatePicker('efd_'+l.id) || ll.date;
            ll.nextDate=readDatePicker('efn_'+l.id);
            ll.note=note;
            ll.nextPlan=entry.querySelector('#efPlan_'+l.id).value.trim() || null;
            editingFollowupId=null;
            showToast('پیگیری به‌روزرسانی شد'); renderMain(); renderList();
            saveData();
          });
        } else {
          entry.innerHTML=`<div class="t-dot"></div><div class="t-card">
            <div class="t-date">${fmtDate(l.date)}${l.by?' — '+l.by:''} <button class="icon-btn t-edit-btn" id="tEdit_${l.id}" style="padding:2px 8px;font-size:11px;">✏️ ویرایش</button></div>
            <div class="t-note">${l.note}</div>
            ${l.nextPlan?`<div class="t-next">برنامه بعدی: ${l.nextPlan}${l.nextDate?' — '+fmtDate(l.nextDate):''}</div>`:''}
          </div>`;
          tl.appendChild(entry);
          entry.querySelector('#tEdit_'+l.id).addEventListener('click', ()=>{ editingFollowupId=l.id; renderMain(); });
        }
      });
      main.appendChild(tl);
    }
  }
}

            <select id="mNazerStatus">
              <option value="none">ثبت اولیه</option>
              <option value="pending">در حال پردازش</option>
              <option value="done">تکمیل‌شده</option>
            </select>
          </div>
          <div class="field" style="margin-top:12px;"><label>نوع مشتری</label>
            <select id="mMarket">
              <option value="securities">بورس اوراق</option>
              <option value="kala">بورس کالا</option>
              <option value="energy">بورس انرژی</option>
            </select>
          </div>
          ${isAdmin ? `<div class="field" style="margin-top:12px;"><label>واگذاری برای پیگیری به</label>
            <select id="mAssignTo">${ownerDirectory().map(o=>`<option value="${o.username}" ${o.username===currentUsername?'selected':''}>${o.name}</option>`).join('')}</select>
          </div>` : ''}
        </div>
      </div>
      <div>
        <div class="reg-card">
          <div class="section-title" style="margin-top:0;margin-bottom:14px;"><span class="dot"></span> ثبت پیگیری اولیه</div>
          <div class="form-grid">
            <div class="field"><label>تاریخ تماس</label>${buildDatePicker('mFDate', todayStr())}</div>
            <div class="field"><label>تاریخ پیگیری بعدی</label>${buildDatePicker('mFNextDate', todayStr())}</div>
            <div class="field full"><label>نتیجه پیگیری</label><textarea id="mFNote" placeholder="مثلاً: تماس گرفتم، گفت هفته دیگه تصمیم می‌گیره..."></textarea></div>
            <div class="field full"><label>برنامه برای دفعه بعد</label><textarea id="mFPlan" placeholder="مثلاً: یادآوری تماس تلفنی، ارسال فرم انتقال کد..."></textarea></div>
          </div>
        </div>
        <div class="reg-card" style="margin-top:16px;">
          <div class="section-title" style="margin-top:0;margin-bottom:14px;"><span class="dot"></span> اطلاعات مالی</div>
          <div class="form-grid">
            <div class="field"><label>مبلغ اعتبار درخواستی (تومان)</label><input id="mReqCredit" inputmode="numeric" placeholder="0" style="direction:ltr;text-align:right;"></div>
            <div class="field"><label>مبلغ اعتبار در کارگزاری قبلی (تومان)</label><input id="mPrevCredit" inputmode="numeric" placeholder="0" style="direction:ltr;text-align:right;"></div>
            <div class="field"><label>کارمزد ماهیانه (تومان)</label><input id="mMonthlyFee" inputmode="numeric" placeholder="0" style="direction:ltr;text-align:right;"></div>
            <div class="field"><label>مبلغ اعتبار سرخطی (شارژ آنلاین) (تومان)</label><input id="mOnlineCredit" inputmode="numeric" placeholder="0" style="direction:ltr;text-align:right;"></div>
            <div class="field"><label>پرتفوی مشتری (تومان)</label><input id="mPortfolioValue" inputmode="numeric" placeholder="0" style="direction:ltr;text-align:right;"></div>
            <div class="field full"><label>اکسل گردش حساب مشتری</label><input type="file" id="mExcelFile" accept=".xlsx,.xls,.csv"><div id="mExcelFileName" style="font-size:12px;color:var(--ink-soft);margin-top:4px;"></div></div>
            <div class="field full"><label>اکسل پرتفوی مشتری</label><input type="file" id="mPortfolioExcelFile" accept=".xlsx,.xls,.csv"><div id="mPortfolioExcelFileName" style="font-size:12px;color:var(--ink-soft);margin-top:4px;"></div></div>
          </div>
        </div>
      </div>
    </div>
    <div class="reg-actions"><button class="reg-save" id="mSave">افزودن مشتری</button></div>
  `;
  main.appendChild(wrap);
  let pendingExcel = null;
  let pendingPortfolioExcel = null;
  ['mReqCredit','mPrevCredit','mMonthlyFee','mOnlineCredit','mPortfolioValue'].forEach(attachMoneyInput);
  if(pendingKarmozdPrefill){
    const pk = pendingKarmozdPrefill; pendingKarmozdPrefill = null;
    if(pk.name) wrap.querySelector('#mName').value = pk.name;
    if(pk.monthlyFee) wrap.querySelector('#mMonthlyFee').value = plainMoney(pk.monthlyFee);
    if(pk.requestedCredit) wrap.querySelector('#mReqCredit').value = plainMoney(pk.requestedCredit);
    if(pk.file){
      pendingExcel = pk.file;
      wrap.querySelector('#mExcelFileName').textContent = 'از محاسبه‌گر کارمزد دریافت شد: '+pk.file.name;
    }
    showToast('اطلاعات از محاسبه‌گر کارمزد بارگذاری شد ✅');
  }
  wrap.querySelector('#mExcelFile').addEventListener('change', (e)=>{
    const file=e.target.files[0];
    if(!file){ pendingExcel=null; wrap.querySelector('#mExcelFileName').textContent=''; return; }
    if(file.size > 3*1024*1024){ showToast('حجم فایل باید کمتر از ۳ مگابایت باشه'); e.target.value=''; pendingExcel=null; wrap.querySelector('#mExcelFileName').textContent=''; return; }
    const reader=new FileReader();
    reader.onload=()=>{
      pendingExcel={name:file.name, data:reader.result, uploadedAt: todayStr()};
      wrap.querySelector('#mExcelFileName').textContent='فایل انتخاب شد: '+file.name;
    };
    reader.onerror=()=>{ showToast('خطا در خواندن فایل'); pendingExcel=null; };
    reader.readAsDataURL(file);
  });
  wrap.querySelector('#mPortfolioExcelFile').addEventListener('change', (e)=>{
    const file=e.target.files[0];
    if(!file){ pendingPortfolioExcel=null; wrap.querySelector('#mPortfolioExcelFileName').textContent=''; return; }
    if(file.size > 3*1024*1024){ showToast('حجم فایل باید کمتر از ۳ مگابایت باشه'); e.target.value=''; pendingPortfolioExcel=null; wrap.querySelector('#mPortfolioExcelFileName').textContent=''; return; }
    const reader=new FileReader();
    reader.onload=()=>{
      pendingPortfolioExcel={name:file.name, data:reader.result, uploadedAt: todayStr()};
      wrap.querySelector('#mPortfolioExcelFileName').textContent='فایل انتخاب شد: '+file.name;
    };
    reader.onerror=()=>{ showToast('خطا در خواندن فایل'); pendingPortfolioExcel=null; };
    reader.readAsDataURL(file);
  });
  const mSaveHandler = async()=>{
    const name=wrap.querySelector('#mName').value.trim();
    if(!name){ showToast('نام مشتری رو وارد کن'); return; }
    const phone=wrap.querySelector('#mPhone').value.trim();
    const nationalId=wrap.querySelector('#mNationalId').value.trim();

    const isDup = Object.values(DATA.clients).some(c=>
      (nationalId && c.nationalId && c.nationalId===nationalId) ||
      (phone && c.phone && c.phone===phone)
    );
    if(isDup){ showToast('مشتری تکراری است'); return; }

    const id='c'+Date.now();
    const followups=[];
    const fNote = wrap.querySelector('#mFNote').value.trim();
    if(fNote){
      const fDate = readDatePicker('mFDate') || todayStr();
      const fNextDate = readDatePicker('mFNextDate');
      const fPlan = wrap.querySelector('#mFPlan').value.trim() || null;
      followups.push({id:'f'+Date.now(), date:fDate, note:fNote, nextDate:fNextDate, nextPlan:fPlan, by: currentUser || null});
    }
    DATA.clients[id]={
      id, name,
      phone,
      nationalId,
      source:wrap.querySelector('#mSource').value,
      nazerStatus: wrap.querySelector('#mNazerStatus').value,
      market: wrap.querySelector('#mMarket').value,
      requestedCredit: readMoneyInput('mReqCredit'),
      prevBrokerCredit: readMoneyInput('mPrevCredit'),
      monthlyFee: readMoneyInput('mMonthlyFee'),
      onlineChargeCredit: readMoneyInput('mOnlineCredit'),
      excelFile: pendingExcel,
      portfolioValue: readMoneyInput('mPortfolioValue'),
      portfolioExcelFile: pendingPortfolioExcel,
      status:'awaiting',
      createdAt: todayStr(),
      createdBy: currentUser || null,
      createdByUsername: currentUsername || null,
      assignedTo: (isAdmin && wrap.querySelector('#mAssignTo')) ? wrap.querySelector('#mAssignTo').value : (currentUsername || null),
      followups
    };
    selectedId=id;
    setActiveTab('awaiting');
    render();
    showToast('مشتری ثبت شد و در «در حال پیگیری» قرار گرفت');
    saveData();
  };
  wrap.querySelector('#mSave').addEventListener('click', mSaveHandler);
  wrap.querySelector('#mSaveTop').addEventListener('click', mSaveHandler);
}

function updateSidebarVisibility(){
  $('#sidebarPanel').classList.toggle('hidden-panel', currentTab==='add' || currentTab==='users' || currentTab==='security' || currentTab==='karmozd');
  $('#main').classList.toggle('full-bleed', currentTab==='karmozd');
}

function setActiveTab(tab){
  currentTab=tab;
  const map={today:'tabToday', all:'tabAll', awaiting:'tabAwaiting', future:'tabFuture', add:'tabAdd', misc:'tabMisc', done:'tabDone', kala:'tabKala', energy:'tabEnergy', users:'tabUsers', marketers:'tabMarketers', karmozd:'tabKarmozd', security:'tabSecurity'};
  Object.keys(map).forEach(t=>{ $('#'+map[t]).classList.toggle('active', t===tab); });
  updateSidebarVisibility();
}

function render(){ renderList(); renderMain(); }

$('#searchBox').addEventListener('input', renderList);
$('#tabToday').addEventListener('click', ()=>{ setActiveTab('today'); render(); });
$('#tabAll').addEventListener('click', ()=>{ setActiveTab('all'); render(); });
$('#tabAwaiting').addEventListener('click', ()=>{ setActiveTab('awaiting'); render(); });
$('#tabFuture').addEventListener('click', ()=>{ setActiveTab('future'); selectedId=null; render(); });
$('#tabAdd').addEventListener('click', ()=>{ setActiveTab('add'); selectedId=null; render(); });
$('#tabMisc').addEventListener('click', ()=>{ setActiveTab('misc'); selectedId=null; render(); });
$('#tabDone').addEventListener('click', ()=>{ setActiveTab('done'); render(); });
$('#tabKala').addEventListener('click', ()=>{ setActiveTab('kala'); render(); });
$('#tabEnergy').addEventListener('click', ()=>{ setActiveTab('energy'); render(); });
$('#tabUsers').addEventListener('click', ()=>{ setActiveTab('users'); render(); });
$('#tabMarketers').addEventListener('click', ()=>{ if(!canSeeMarketers()) return; setActiveTab('marketers'); selectedMarketerId=null; render(); });
$('#tabKarmozd').addEventListener('click', ()=>{ setActiveTab('karmozd'); render(); });
$('#tabSecurity').addEventListener('click', ()=>{ setActiveTab('security'); render(); });

window.addEventListener('message', (e)=>{
  const d = e.data;
  if(!d || d.source !== 'karmozd-calculator' || d.type !== 'send-to-add-customer') return;
  if(!currentUsername) return;
  pendingKarmozdPrefill = { name: d.name, monthlyFee: d.monthlyFee, requestedCredit: d.requestedCredit, file: d.file };
  setActiveTab('add');
  selectedId = null;
  render();
});

if(!backendConfigured){ showBackendNotConfigured(); } else { initAuth(); }

let lastFormInteractionAt = 0;
$('#main').addEventListener('input', ()=>{ lastFormInteractionAt = Date.now(); });
$('#main').addEventListener('change', ()=>{ lastFormInteractionAt = Date.now(); });

setInterval(async ()=>{
  if(!currentUsername) return;
  if(Date.now() - lastLocalSaveAt < 3000) return;
  if(editingClientId || editingFollowupId) return; // فرم ویرایش باز است — دیتا را جایگزین نکن
  if(Date.now() - lastFormInteractionAt < 20000) return; // اخیراً توی یکی از فیلدهای فرم چیزی تایپ/انتخاب شده
  const activeEl = document.activeElement;
  const isTyping = activeEl && (activeEl.tagName==='TEXTAREA' || activeEl.tagName==='SELECT' || (activeEl.tagName==='INPUT' && activeEl.type!=='file'));
  if(isTyping) return; // کاربر الان روی یه فیلده — دیتا رو جایگزین نکن که چیزی گم نشه
  try{
    const res = await sGet(STORE_KEY, true);
    if(res && res.value) DATA = JSON.parse(res.value);
    if(isAdmin) await loadAuthState();
  }catch(e){ /* ignore transient errors */ }
  renderList();
  checkFollowupNotifications();
  if(currentTab !== 'add' && currentTab !== 'karmozd') renderMain();
}, 8000);

$('#followupBannerClose').addEventListener('click', ()=>{ $('#followupBanner').style.display='none'; });

</script>
